<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyon’s Apartments & Suites</title>
<link rel="stylesheet" href="styles/styles.css">
<script src="scripts/rooms.js" defer></script>
</head>

<body>

<header>
  <img src="images/logo.png" alt="Lyons Apartment" width="100" >
  <nav>
    <a href="index.html">Home</a>
    <a href="rooms.html">Rooms</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Welcome to Lyon’s Apartments</h2>
  <button onclick="scrollToBooking()">Book Now</button>
</section>

<section class="rooms" id="rooms-container">
  <!-- JS will load rooms here -->
</section>

<section class="booking" id="booking">
  <h2>Book a Room</h2>

  <form id="bookingForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="date" id="checkin" required>
    <input type="date" id="checkout" required>
    <button type="submit">Book Now</button>
  </form>

  <p id="message"></p>
</section>

<footer>
  <p>© 2026 Lyon’s Apartments</p>
  <a href="references.html">References</a>
</footer>

</body>
</html>
